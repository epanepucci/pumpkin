[package]
name = "pumpkin"
version = "2.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.102"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
eframe = { version = "0.33.3", features = ["wgpu"] }
egui = "0.33.3"
hdf5-metno = { version = "0.12.4", features = ["static", "zlib"] }
ndarray = "0.17.2"
rayon = "1.11.0"
reqwest = { version = "0.13.2", default-features = false, features = ["json", "http2"] }
serde_json = "1.0.149"
tiff = "0.11.3"
tokio = { version = "1.51.1", features = ["full"] }
egui-file-dialog = "0.12"
png = "0.18"
